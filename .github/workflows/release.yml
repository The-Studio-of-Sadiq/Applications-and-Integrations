name: Build PDF and release

# Builds the book PDF with headless Chrome. On a version tag (v1.2.0) it publishes a
# GitHub release with the PDF attached; on a manual run it uploads the PDF as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check sources
        run: node scripts/check-book.mjs

      - name: Build PDF
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/build-pdf.mjs 2>&1 | tee build.log

      - name: Fail on math or image errors
        run: |
          if grep -E "failed to render|missing image" build.log; then
            echo "::error::The PDF build reported problems (see above)."; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Applications-and-Integrations-pdf
          path: dist/Applications-and-Integrations.pdf
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Applications-and-Integrations.pdf --clobber
          else
            gh release create "$TAG" dist/Applications-and-Integrations.pdf \
              --title "Applications and Integrations $TAG" --notes "${notes:-See CHANGELOG.md.}"
          fi
